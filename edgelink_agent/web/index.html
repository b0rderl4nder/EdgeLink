<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EdgeLink 配网</title>
  <style>
    :root { color-scheme: dark; --bg:#11110f; --panel:#1b1a17; --line:#34312b;
      --text:#f5f1e8; --muted:#aaa397; --accent:#d8a34a; --ok:#64bc8a; --bad:#d46e65; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text);
      font:15px/1.5 system-ui,-apple-system,"Microsoft YaHei",sans-serif; }
    main { width:min(680px,100%); margin:auto; padding:28px 18px 60px; }
    header { display:flex; align-items:end; justify-content:space-between; margin-bottom:24px; }
    h1 { font-size:24px; margin:0; }
    header span,.muted { color:var(--muted); }
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:16px;
      padding:18px; margin:12px 0; }
    .status { display:grid; grid-template-columns:1fr auto; gap:10px; }
    .status strong { color:var(--accent); }
    button,input { min-height:46px; border-radius:11px; border:1px solid var(--line); font:inherit; }
    input { width:100%; background:#121210; color:var(--text); padding:0 13px; margin:6px 0 12px; }
    button { background:var(--accent); color:#17130c; font-weight:700; padding:0 17px; cursor:pointer; }
    button.secondary { background:transparent; color:var(--text); }
    button:disabled { opacity:.55; }
    .row { display:flex; gap:10px; flex-wrap:wrap; }
    .networks { display:grid; gap:8px; margin:12px 0; }
    .network { display:flex; justify-content:space-between; align-items:center; width:100%;
      background:#151512; color:var(--text); text-align:left; }
    .network small { color:var(--muted); }
    #message { min-height:24px; }
    .ok { color:var(--ok); } .bad { color:var(--bad); }
    @media(max-width:480px) { header { align-items:start; flex-direction:column; gap:4px; }
      .row button { flex:1; } }
  </style>
</head>
<body><main>
  <header><div><h1>网络恢复</h1><span>{{DEVICE_NAME}}</span></div>
    <span id="agentState">检查中</span></header>
  <section class="panel status">
    <span>Wi‑Fi</span><strong id="wifi">检查中</strong>
    <span>网络出口</span><strong id="uplink">检查中</strong>
    <span>EasyTier</span><strong id="overlay">检查中</strong>
  </section>
  <section class="panel">
    <strong>连接现场网络</strong>
    <p class="muted">新网络验证失败时，配网热点会自动恢复。</p>
    <div class="row"><button id="scan">扫描Wi‑Fi</button>
      <button class="secondary" id="recover">立即恢复</button></div>
    <div id="networks" class="networks"></div>
    <form id="connect">
      <label>网络名称<input id="ssid" maxlength="32" required autocomplete="off"></label>
      <label>Wi‑Fi密码<input id="password" type="password" maxlength="64"
        autocomplete="current-password"></label>
      <button id="connectButton" type="submit">连接并验证</button>
    </form>
    <p id="message" aria-live="polite"></p>
  </section>
  <section class="panel">
    <strong>配网热点</strong><p class="muted">断网超过安全窗口后自动开启，也可以手动恢复。</p>
    <div class="row"><button class="secondary" id="apStart">重新开启热点</button></div>
  </section>
</main><script>
  const $ = id => document.getElementById(id);
  const reasonText = {
    accepted:'已受理', queued_request_replaced:'已更新为最新配网请求', connecting:'正在连接',
    connected:'连接成功', provisioning_busy:'另一项配网正在进行',
    invalid_ssid:'网络名称不符合Wi‑Fi规范', invalid_wifi_password:'密码格式不符合Wi‑Fi规范',
    connection_failed:'无法连接目标网络', connection_not_usable:'目标网络无法正常访问',
    ssid_not_found:'未发现该Wi‑Fi，请确认名称和信号范围',
    authentication_failed:'Wi‑Fi认证失败，请检查密码或网络认证方式',
    activation_timeout:'连接超时，请靠近路由器后重试',
    dhcp_failed:'已连接Wi‑Fi，但未获得网络地址',
    address_conflict:'网络地址冲突，请稍后重试或检查路由器',
    interface_unmanaged:'无线网卡当前未由NetworkManager管理',
    profile_prepare_failed:'无法创建安全的Wi‑Fi配置',
    captive_portal:'网络需要网页认证',
    internet_evidence_unavailable:'已接入局域网，但尚未验证互联网出口',
    uplink_target_unreachable:'网络出口验证未通过',
    connection_failed_ap_restoring:'连接失败，正在恢复配网热点',
    connection_not_usable_ap_restoring:'网络不可用，正在恢复配网热点',
    connection_failed_previous_restored:'连接失败，已恢复原网络',
    connection_not_usable_previous_restored:'目标网络不可用，已恢复原网络',
    profile_commit_failed:'网络验证成功，但保存失败',
    profile_commit_failed_previous_restored:'网络保存失败，已恢复原网络',
    profile_commit_failed_ap_restoring:'网络保存失败，正在恢复配网热点',
    checkpoint_commit_failed:'网络检查点提交失败，已进入安全回滚',
    fallback_ap_restore_pending:'正在恢复配网热点',
    external_fallback_ap_active:'设备兜底热点可用，可在此连接新的Wi‑Fi'
  };
  const stateText = {online:'在线', provisioning:'等待配网', recovering:'正在恢复',
    degraded:'网络异常', starting:'启动中', stopped:'已停止'};
  async function api(path, options) {
    const response = await fetch(path, options);
    const data = await response.json();
    if (!response.ok) throw new Error(data.reason || data.error || '操作失败');
    return data;
  }
  function show(text, ok=true) {
    $('message').textContent = text; $('message').className = ok ? 'ok' : 'bad';
  }
  function friendlyReason(reason) {
    if (reasonText[reason]) return reasonText[reason];
    const suffixes = [
      ['_checkpoint_rolled_back', '，已由系统检查点恢复原网络'],
      ['_previous_restored', '，已恢复原网络'],
      ['_ap_restoring', '，正在恢复配网热点']
    ];
    for (const [suffix, note] of suffixes) {
      if (reason.endsWith(suffix)) {
        const base = reason.slice(0, -suffix.length);
        return (reasonText[base] || '连接失败') + note;
      }
    }
    return reason || '操作失败';
  }
  async function refresh() {
    try {
      const status = await api('/v1/status');
      $('agentState').textContent = stateText[status.state] || status.state;
      $('wifi').textContent = status.network.ssid || status.network.connection_name || '未连接';
      const healthText = {internet:'互联网可用', local:'仅局域网', portal:'需要认证',
        disconnected:'未连接'};
      $('uplink').textContent = status.network.validation_passed
        ? (healthText[status.network.health_level] || '可用')
        : friendlyReason(status.network.error || status.reason);
      $('overlay').textContent = status.overlay.connected
        ? (status.overlay.virtual_ip || '在线') : '未连接';
      const operation = status.provisioning || {};
      if (operation.phase === 'failed') show(friendlyReason(operation.reason), false);
      if (operation.phase === 'succeeded') show('连接成功，正在恢复远程网络');
    } catch (_) { $('agentState').textContent = '服务不可用'; }
  }
  async function post(path, body) {
    return api(path, {method:'POST', headers:{'Content-Type':'application/json'},
      body:body ? JSON.stringify(body) : undefined});
  }
  $('scan').onclick = async () => {
    show('正在扫描…');
    try {
      const data = await api('/v1/wifi/scan'); $('networks').innerHTML = '';
      data.networks.forEach(network => {
        const button = document.createElement('button');
        button.type = 'button'; button.className = 'network';
        button.textContent = network.ssid;
        const detail = document.createElement('small');
        detail.textContent = `${network.signal}% · ${network.security || '开放'}`;
        button.appendChild(detail);
        button.onclick = () => { $('ssid').value = network.ssid; $('password').focus(); };
        $('networks').appendChild(button);
      });
      show(data.networks.length ? '请选择网络' : '没有发现网络');
    } catch (error) { show(error.message, false); }
  };
  $('connect').onsubmit = async event => {
    event.preventDefault();
    const ssid = $('ssid').value, password = $('password').value;
    const encoder = new TextEncoder();
    const validPassword = !password || /^[0-9a-fA-F]{64}$/.test(password)
      || (encoder.encode(password).length >= 8 && encoder.encode(password).length <= 63);
    if (!ssid || encoder.encode(ssid).length > 32) {
      show('网络名称不符合Wi‑Fi规范', false); return;
    }
    if (!validPassword || /[\0\r\n]/.test(password)) {
      show('密码格式不符合Wi‑Fi规范', false); return;
    }
    $('connectButton').disabled = true; show('正在提交配网任务…');
    try {
      const result = await post('/v1/wifi/connect', {ssid, password});
      $('password').value = '';
      show(result.reason === 'queued_request_replaced'
        ? '已更新为最新配网请求' : '已受理，设备正在验证网络');
      setTimeout(refresh, 1500);
    } catch (error) { show(friendlyReason(error.message), false); }
    finally { $('connectButton').disabled = false; }
  };
  $('recover').onclick = () => post('/v1/network/recover')
    .then(() => show('已开始恢复')).catch(error => show(error.message, false));
  $('apStart').onclick = () => post('/v1/ap/start')
    .then(() => show('热点已启动')).catch(error => show(error.message, false));
  let lastActivityAt = 0;
  function noteActivity() {
    const now = Date.now();
    if (now - lastActivityAt < 15000) return;
    lastActivityAt = now;
    post('/v1/provisioning/activity').catch(() => {});
  }
  ['pointerdown', 'keydown', 'input'].forEach(name =>
    document.addEventListener(name, noteActivity, {passive:true}));
  refresh(); setInterval(refresh, 3000);
</script></body></html>
