[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "edgelink-agent"
version = "0.3.3"
description = "Portable Wi-Fi provisioning, AP fallback and overlay recovery agent for edge devices"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
edgelink-agent = "edgelink_agent.main:main"
edgelinkctl = "edgelink_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["edgelink_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
